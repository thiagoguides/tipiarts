<div class="product-card" style="cursor: pointer;" onclick="window.location.href='/produto/?id={{id}}'">
    <div class="product-image">
        <i class="fa-solid fa-box-open"></i>
    </div>
    <div class="product-info">
        <div class="product-title">{{nome}}</div>
        <div class="product-desc">{{descricao}}</div>
        <div class="product-measures"><i class="fa-solid fa-ruler-combined"></i> {{medidas}}</div>
        <div class="product-price">{{precoFormatado}}</div>
        
        <!-- Usamos event.stopPropagation() para que clicar no botão adicione ao carrinho 
             sem disparar o redirecionamento do card inteiro -->
        <button class="add-to-cart-btn" onclick="event.stopPropagation(); addToCart({{id}})">
            <i class="fa-solid fa-cart-plus"></i> Adicionar
        </button>
    </div>
</div>
