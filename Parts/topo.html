<header>
    <div class="header-container">
        <a href="/" class="logo">
            <img src="/fotos/logo.ico" height="45" alt="Tipi Arts" />
            Tipi <span>Arts</span>
        </a>

        <div class="search-box-wrapper" id="searchBoxWrapper">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar caixas, lembrancinhas, organizadores...">
                <button type="button" title="Buscar" id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div id="searchDropdown" class="search-dropdown" style="display: none;"></div>
        </div>

        <div class="header-actions">
            <button type="button" class="icon-btn mobile-search-toggle" id="mobileSearchToggleBtn" title="Pesquisar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Buscar</span>
            </button>

            <button type="button" class="icon-btn" id="themeToggleBtn" title="Alternar Tema">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
                <span>Tema</span>
            </button>

            <button type="button" class="icon-btn" id="ajustesOpenBtn" title="Configurações e Acesso Lojista">
                <i class="fa-solid fa-gear"></i>
                <span>Ajustes</span>
            </button>

            <button type="button" class="icon-btn" id="cartOpenBtn" title="Carrinho">
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Carrinho</span>
                <span class="cart-count" id="cartCount">0</span>
            </button>
        </div>
    </div>
</header>
<!-- JANELA MODAL DE AJUSTES E CADASTRO -->
<div class="modal-overlay" id="ajustesModal" style="display: none;">
    <div class="modal-box">
        <div class="modal-header">
            <h3><i class="fa-solid fa-user-gear"></i> Painel do Lojista </h3>
            <button class="modal-close" id="ajustesCloseBtn">&times;</button>
        </div>
        
        <div class="modal-body">
            <!-- SEÇÃO 1: ACESSO E PREÇOS -->
            <div class="modal-section">
                <h4><i class="fa-solid fa-lock"></i> Acesso aos Preços (Atacado)</h4>
                <p class="modal-desc" id="statusAcessoText">Status: <strong style="color: #e74c3c;">Preços Ocultos / Senha Necessária</strong></p>
                
                <div class="input-group" id="divFormSenha">
                    <input type="password" id="senhaLojistaInput" placeholder="Digite a senha mestra...">
                    <button class="btn-primary" onclick="tentarDescriptografarPrecos()">Desbloquear Preços</button>
                </div>

                <div id="divModoVitrine" style="display: none; margin-top: 10px;">
                    <button class="btn-secondary" onclick="alternarModoVitrine()" style="width: 100%; background: #e67e22; color: #fff;">
                        <i class="fa-solid fa-eye-slash"></i> <span id="txtModoVitrine">Esconder Preços (Modo Vitrine Balcão)</span>
                    </button>
                </div>
            </div>

            <hr class="modal-divider">

          
        </div>
    </div>
</div>
