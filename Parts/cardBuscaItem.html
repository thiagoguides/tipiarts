<div class="search-dropdown-item">
    <div class="search-item-info" onclick="irParaProduto({{id}})">
        <i class="fa-solid fa-box-open"></i>
        <div class="search-item-details">
            <div class="search-item-title">{{nome}}</div>
            <div class="search-item-price">{{precoExibido}}</div>
        </div>
    </div>
    <button class="search-item-add-btn" onclick="addToCart({{id}})" title="Adicionar ao carrinho">
        <i class="fa-solid fa-cart-plus"></i> Adicionar
    </button>
</div>
